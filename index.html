<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFCノート</title>
<meta name="theme-color" content="#f6f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PFCノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f0;--card:#fff;--ink:#1f2a2e;--sub:#7b8689;--line:#e4e2d9;
  --p:#e4572e;--f:#e0a100;--c:#2e86ab;--ok:#3b8f5c;--warn:#c67a12;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c1e;--card:#222a2d;--ink:#eef1ef;--sub:#97a3a6;--line:#344043}}
:root[data-theme="dark"]{--bg:#171c1e;--card:#222a2d;--ink:#eef1ef;--sub:#97a3a6;--line:#344043}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:12px 14px 100px}
h1{font-size:20px;font-weight:900;margin:6px 0 10px}
h2{font-size:16px;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;color:var(--sub);padding:12px 0;font:700 12px inherit;font-family:inherit}.nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}.datebar b{font-size:16px}
button{font-family:inherit;cursor:pointer}button.sm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:700 13px inherit}button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}button:disabled{opacity:.5}
.bar{margin:9px 0}.bar .t{display:flex;justify-content:space-between;font-size:13px}.bar .t b{font-weight:900}.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:3px}.track i{display:block;height:100%;border-radius:6px;transition:width .3s}.rem,.note{font-size:12px;color:var(--sub)}.kcal{font-size:13px;color:var(--sub);margin-top:5px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}.mealTotal{font-size:11px;color:var(--sub);text-align:right;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fld label{font-size:11px;font-weight:700;display:block;margin-bottom:2px}.fld input,.add input,.txt{width:100%;font-family:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}.fld input{font:700 17px inherit;padding:8px;text-align:right}.txt{font-size:15px;padding:9px}.fld input::placeholder,.txt::placeholder{color:var(--sub);opacity:.58;font-weight:400}
.inp{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}.manual{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}.manual summary{font-size:12px;color:var(--sub);cursor:pointer}.manualGrid{display:grid;grid-template-columns:1.5fr repeat(3,.65fr) auto;gap:6px;margin-top:8px}.manualGrid input{min-width:0;font:700 14px inherit;padding:8px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.it{border-top:1px solid var(--line);padding:9px 0}.it:first-of-type{border-top:0}.itn{display:flex;align-items:center;gap:6px;margin-bottom:6px}.nm2{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:700 15px inherit;padding:2px 0}.tag{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 6px;white-space:nowrap}.tag.est{color:var(--warn)}.x{border:0;background:none;color:var(--sub);font-size:15px;padding:4px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font:700 12px inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .n{font-size:12px;color:var(--sub)}
.add{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px}.add input{font-size:15px;padding:8px 6px}.add .nm{grid-column:1/-1;text-align:left}.pc{color:var(--p)}.fc{color:var(--f)}.cc{color:var(--c)}
.listGroup{margin-bottom:12px}.listHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.empty{padding:14px 0;text-align:center;color:var(--sub);font-size:13px}.legend{font-size:11px;color:var(--sub);margin-top:6px}.aiBox{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}.aiBox summary{cursor:pointer;font-size:13px;font-weight:700}.aiBox textarea{width:100%;min-height:76px;resize:vertical;margin-top:8px;padding:9px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:14px/1.5 inherit}.aiActions{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.aiHint{font-size:11px;color:var(--sub);margin-top:6px}.aiPaste{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
@media(max-width:430px){.manualGrid{grid-template-columns:1fr repeat(3,.55fr)}.manualGrid button{grid-column:1/-1}.mealTotal{font-size:10px}.nav button{font-size:11px}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<script>
const MEALS=[["b","朝"],["l","昼"],["d","晩"],["s","間食"]];
const K=["p","f","c"], KN={p:"P たんぱく質",f:"F 脂質",c:"C 炭水化物"}, KC={p:"var(--p)",f:"var(--f)",c:"var(--c)"}, KCAL={p:4,f:9,c:4};
let S={t:{p:120,f:60,c:250},favs:[],days:{}}, tab="today", date=ymd(new Date()), txt={}, msg={}, aiTxt={}, aiPaste={};
try{const r=localStorage.getItem("pfc-v2");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}

/* ざっくり推定用データ。100gあたり。値は目安で、厳密な栄養計算用ではありません。 */
const FOOD_DB=[
  {names:["鶏むね","鶏胸","むね肉","胸肉"],p:23.3,f:1.9,c:0,def:100},
  {names:["ささみ"],p:23.9,f:0.8,c:0,def:100},
  {names:["鶏もも","もも肉"],p:18.8,f:3.9,c:0,def:100},
  {names:["鮭おにぎり","しゃけおにぎり"],p:4.8,f:1.8,c:36.0,def:110},
  {names:["おにぎり","おむすび"],p:2.7,f:0.4,c:38.0,def:110},
  {names:["サラダチキン"],p:23.5,f:1.5,c:1.0,def:110},
  {names:["鮭","サーモン"],p:22.3,f:4.1,c:0.1,def:100},
  {names:["まぐろ","マグロ"],p:26.4,f:1.4,c:0.1,def:100},
  {names:["豚ロース"],p:22.7,f:5.6,c:0.2,def:100},
  {names:["牛もも"],p:21.2,f:9.6,c:0.5,def:100},
  {names:["木綿豆腐","豆腐"],p:7.0,f:4.9,c:1.5,def:150},
  {names:["絹ごし豆腐"],p:5.3,f:3.5,c:2.0,def:150},
  {names:["白ごはん","ごはん","ご飯","白米"],p:2.5,f:0.3,c:37.1,def:150},
  {names:["玄米"],p:2.8,f:1.0,c:35.6,def:150},
  {names:["オートミール"],p:13.7,f:5.7,c:69.1,def:30},
  {names:["食パン"],p:8.9,f:4.1,c:46.4,def:60},
  {names:["うどん"],p:2.6,f:0.4,c:21.6,def:250},
  {names:["そば","蕎麦"],p:4.8,f:1.0,c:26.0,def:200},
  {names:["パスタ","スパゲッティ"],p:5.8,f:0.9,c:32.2,def:250},
  {names:["バナナ"],p:1.1,f:0.2,c:22.5,def:100},
  {names:["りんご","リンゴ"],p:0.2,f:0.1,c:15.5,def:200},
  {names:["無糖ヨーグルト","ヨーグルト"],p:3.6,f:3.0,c:4.9,def:100},
  {names:["牛乳"],p:3.3,f:3.8,c:4.8,def:200},
  {names:["低脂肪乳"],p:3.8,f:1.0,c:5.5,def:200},
  {names:["納豆"],p:16.5,f:10.0,c:12.1,def:45},
  {names:["ゆで卵","ゆでたまご"],p:12.2,f:10.2,c:0.4,def:50},
  {names:["卵","たまご","玉子"],p:12.2,f:10.2,c:0.4,def:50},
  {names:["チーズ"],p:22.7,f:26.0,c:1.3,def:20},
  {names:["アボカド"],p:2.1,f:17.5,c:7.9,def:100},
  {names:["ブロッコリー"],p:5.4,f:0.6,c:6.6,def:100},
  {names:["じゃがいも","ジャガイモ"],p:1.8,f:0.1,c:17.3,def:100},
  {names:["さつまいも","サツマイモ"],p:1.2,f:0.2,c:31.9,def:150},
  {names:["プロテイン"],p:70,f:7,c:10,def:30}
];

function save(){try{localStorage.setItem("pfc-v2",JSON.stringify(S))}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function shift(n){const d=new Date(date+"T00:00:00");d.setDate(d.getDate()+n);date=ymd(d);render()}
function label(s){const d=new Date(s+"T00:00:00");return (d.getMonth()+1)+"/"+d.getDate()+"（"+"日月火水木金土"[d.getDay()]+"）"}
function items(m,s){s=s||date;const d=S.days[s]||(S.days[s]={});return d[m]||(d[m]=[])}
function mt(m,s){const o={p:0,f:0,c:0};items(m,s).forEach(i=>K.forEach(k=>o[k]+=+i[k]||0));return o}
function total(s){const o={p:0,f:0,c:0};MEALS.forEach(([m])=>{const v=mt(m,s);K.forEach(k=>o[k]+=v[k])});return o}
const kcal=o=>Math.round(K.reduce((a,k)=>a+(+o[k]||0)*KCAL[k],0));
const r1=n=>Math.round((+n||0)*10)/10;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function parseExactPFC(t){
  const get=letter=>{const m=t.match(new RegExp(letter+"\\s*[:：]?\\s*(\\d+(?:\\.\\d+)?)","i"));return m?+m[1]:null};
  const p=get("P"),f=get("F"),c=get("C");
  if(p===null&&f===null&&c===null)return null;
  return {p:p||0,f:f||0,c:c||0};
}
function parseAmount(t,food){
  let m=t.match(/(\d+(?:\.\d+)?)\s*(g|ｇ|ml|mL|ＭＬ|ミリリットル)/i);
  if(m)return +m[1];
  m=t.match(/(\d+(?:\.\d+)?)\s*(個|枚|本|杯|パック)/);
  if(m){
    const n=+m[1],unit=m[2];
    if(food.names.includes("卵"))return n*50;
    if(food.names.includes("納豆"))return n*45;
    if(food.names.includes("食パン"))return n*60;
    if(food.names.includes("バナナ"))return n*100;
    if(food.names.includes("プロテイン"))return n*30;
    if(unit==="杯"&&food.names.includes("ごはん"))return n*150;
    return n*(food.def||100);
  }
  return food.def||100;
}
function estimateFood(t){
  const exact=parseExactPFC(t);
  if(exact){
    const clean=t.replace(/\b[PCF]\s*[:：]?\s*\d+(?:\.\d+)?/ig,"").replace(/[、,／/]+$/g,"").trim();
    return {name:clean||t,p:r1(exact.p),f:r1(exact.f),c:r1(exact.c),src:"指定"};
  }
  const food=FOOD_DB.find(x=>x.names.some(n=>t.includes(n)));
  if(!food)return null;
  const amount=parseAmount(t,food),scale=amount/100;
  return {name:t,p:r1(food.p*scale),f:r1(food.f*scale),c:r1(food.c*scale),src:"推定"};
}
function addEstimate(m){
  const t=(txt[m]||"").trim();if(!t)return;
  const est=estimateFood(t);
  if(est){items(m).push(est);msg[m]=est.src==="指定"?"入力されたPFCをそのまま記録したよ":"簡易データから推定したよ。必要なら数字を直してね"}
  else{items(m).push({name:t,p:0,f:0,c:0,src:"要入力"});msg[m]="この食品は自動推定できなかったので、P/F/Cを入力してね"}
  txt[m]="";save();render();
}
function splitFoods(t){
  return String(t||"").replace(/\r/g,"").split(/\n|、|,|；|;/).map(x=>x.trim()).filter(Boolean);
}
function addBatchEstimate(m){
  const raw=(aiTxt[m]||"").trim();if(!raw)return;
  const parts=splitFoods(raw);let ok=0,unknown=0;
  parts.forEach(t=>{const est=estimateFood(t);if(est){items(m).push(est);ok++}else{items(m).push({name:t,p:0,f:0,c:0,src:"要入力"});unknown++}});
  aiTxt[m]="";save();msg[m]=unknown?`${parts.length}品目を追加。${unknown}品目はPFC要入力だよ`:`${ok}品目をまとめて追加したよ`;render();
}
function aiPromptText(m){
  const meal=(MEALS.find(x=>x[0]===m)||[])[1]||"食事";
  const raw=(aiTxt[m]||"").trim();
  return `次の${meal}の食事を品目ごとに分け、各品目のPFCを推定してください。\n\n【食事】\n${raw}\n\nルール:\n- P=たんぱく質g、F=脂質g、C=炭水化物g\n- 商品名や量が分かる場合はそれを優先\n- 量が不明なら一般的な1人前で推定\n- 入力文にP/F/Cの数値が明記されている品目は、その数値を変更せず src を「指定」にする\n- それ以外は src を「AI推定」にする\n- 返答はJSON配列だけ。説明文やコードブロックは不要\n\n形式:\n[{"name":"鮭おにぎり 1個","p":5.0,"f":1.8,"c":39.0,"src":"AI推定"}]`;
}
async function copyAIPrompt(m,openChat=false){
  const raw=(aiTxt[m]||"").trim();if(!raw){msg[m]="まず食べたものを書いてね";render();return}
  const t=aiPromptText(m);let done=false;
  try{await navigator.clipboard.writeText(t);done=true}catch(e){}
  if(!done){
    const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{done=document.execCommand("copy")}catch(e){}ta.remove();
  }
  msg[m]=done?"ChatGPTに渡す文をコピーしたよ。ChatGPTで貼り付けて送ってね":"コピーできなかったので、入力文をChatGPTに送ってPFCをJSONで出してもらってね";render();
  if(openChat&&done)setTimeout(()=>{location.href="https://chatgpt.com/"},120);
}
function parseAIArray(raw){
  raw=String(raw||"").trim();
  raw=raw.replace(/^PFCNOTE\s*[:：]?\s*/i,"").replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"").trim();
  const first=raw.indexOf("["),last=raw.lastIndexOf("]");
  if(first>=0&&last>first)raw=raw.slice(first,last+1);
  const r=JSON.parse(raw);
  return Array.isArray(r)?r:(r&&Array.isArray(r.items)?r.items:[]);
}
function importAIText(m,raw){
  try{
    const arr=parseAIArray(raw);if(!arr.length)throw 0;
    let n=0;
    arr.forEach(x=>{if(!x||!x.name)return;items(m).push({name:String(x.name),p:r1(Math.max(0,+x.p||0)),f:r1(Math.max(0,+x.f||0)),c:r1(Math.max(0,+x.c||0)),src:x.src==="指定"?"指定":"AI推定"});n++});
    if(!n)throw 0;aiPaste[m]="";save();msg[m]=`${n}品目をAI結果から登録したよ`;render();return true;
  }catch(e){msg[m]="AI結果を読み込めなかったよ。私の返答のJSON部分をコピーして、もう一度試してね";render();return false}
}
function importAIResult(m){
  const raw=(aiPaste[m]||"").trim();if(!raw)return;
  importAIText(m,raw);
}
async function importClipboard(m){
  try{
    const raw=await navigator.clipboard.readText();
    if(!raw.trim())throw 0;
    importAIText(m,raw);
  }catch(e){
    msg[m]="クリップボードを読めなかったよ。下の欄に貼り付けて「AI結果を登録」を使ってね";render();
  }
}
function addManual(m){
  const g=id=>document.getElementById(id),n=(g("mn_"+m)?.value||"").trim();if(!n)return;
  items(m).push({name:n,p:r1(+g("mp_"+m).value||0),f:r1(+g("mf_"+m).value||0),c:r1(+g("mc_"+m).value||0),src:"指定"});
  save();msg[m]="指定値で追加したよ";render();
}
function edit(m,i,k,v){const it=items(m)[i];if(k==="name")it.name=v;else it[k]=Math.max(0,parseFloat(v)||0);it.src="指定";save();render()}
function del(m,i){items(m).splice(i,1);save();render()}
function addFav(m,id){const f=S.favs.find(x=>x.id===id);if(!f)return;items(m).push({name:f.name,p:f.p,f:f.f,c:f.c,src:"指定"});save();render()}
function starIt(m,i){const it=items(m)[i];if(!S.favs.some(f=>f.name===it.name))S.favs.push({id:Date.now(),name:it.name,p:it.p,f:it.f,c:it.c});save();msg[m]="★品目に登録したよ";render()}
function addNewFav(){const g=id=>document.getElementById(id).value,n=g("fn").trim();if(!n)return;S.favs.push({id:Date.now(),name:n,p:+g("fp")||0,f:+g("ff")||0,c:+g("fc")||0});save();render()}
function delFav(id){S.favs=S.favs.filter(x=>x.id!==id);save();render()}
function setT(k,v){S.t[k]=Math.max(0,parseFloat(v)||0);save();render()}

function cleanState(raw){
  const x=raw&&raw.data&&raw.app==="PFCノート"?raw.data:raw;
  if(!x||typeof x!=="object"||!x.t||!x.days)throw new Error("bad backup");
  const out={t:{p:0,f:0,c:0},favs:[],days:{}};
  K.forEach(k=>out.t[k]=Math.max(0,+x.t[k]||0));
  if(Array.isArray(x.favs))out.favs=x.favs.map((f,i)=>({id:+f.id||Date.now()+i,name:String(f.name||"品目"),p:r1(Math.max(0,+f.p||0)),f:r1(Math.max(0,+f.f||0)),c:r1(Math.max(0,+f.c||0))}));
  if(x.days&&typeof x.days==="object")Object.entries(x.days).forEach(([d,day])=>{
    if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(d)||!day||typeof day!=="object")return;
    out.days[d]={};
    MEALS.forEach(([m])=>{
      const arr=Array.isArray(day[m])?day[m]:[];
      out.days[d][m]=arr.map(it=>({name:String(it?.name||"品目"),p:r1(Math.max(0,+it?.p||0)),f:r1(Math.max(0,+it?.f||0)),c:r1(Math.max(0,+it?.c||0)),src:String(it?.src||"指定")}));
    });
  });
  return out;
}
async function exportBackup(){
  const payload={app:"PFCノート",version:1,exportedAt:new Date().toISOString(),data:S};
  const body=JSON.stringify(payload,null,2);
  const fn=`PFCノート_バックアップ_${ymd(new Date())}.json`;
  const file=new File([body],fn,{type:"application/json"});
  try{
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:"PFCノート バックアップ",files:[file]});
      alert("バックアップを書き出したよ。『ファイルに保存』など好きな場所へ保存してね");
      return;
    }
  }catch(e){if(e&&e.name==="AbortError")return;}
  const url=URL.createObjectURL(file),a=document.createElement("a");
  a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  alert("バックアップを書き出したよ。ダウンロード先に保存されてるよ");
}
async function restoreBackup(file){
  if(!file)return;
  try{
    const raw=JSON.parse(await file.text());
    const next=cleanState(raw);
    if(!confirm("バックアップを復元すると、今この端末にあるPFCノートの記録は置き換わるよ。復元する？"))return;
    S=next;save();date=ymd(new Date());tab="today";render();
    alert("バックアップから復元したよ");
  }catch(e){alert("このファイルはPFCノートのバックアップとして読み込めなかったよ");}
  finally{const el=document.getElementById("restoreFile");if(el)el.value="";}
}

function bars(t){let h="";K.forEach(k=>{const tg=S.t[k],pc=tg?Math.min(100,t[k]/tg*100):0,left=tg-t[k];h+=`<div class="bar"><div class="t"><span><b style="color:${KC[k]}">${KN[k]}</b></span><span><b>${r1(t[k])}</b> / ${tg}g</span></div><div class="track"><i style="width:${pc}%;background:${KC[k]}"></i></div><div class="rem">${left>=0?"あと "+r1(left)+"g":"目標を "+r1(-left)+"g オーバー"}</div></div>`});return h+`<div class="kcal">合計 ${kcal(t)} kcal（PFCから計算）／ 目標 ${kcal(S.t)} kcal</div>`}
function dateBar(){return `<div class="datebar"><button class="sm" onclick="shift(-1)">◀</button><b>${label(date)}${date===ymd(new Date())?" 今日":""}</b><button class="sm" onclick="shift(1)">▶</button></div>`}

function viewToday(){
  let h=dateBar()+`<div class="card" style="margin-top:10px"><h2>1日の合計</h2>${bars(total(date))}</div>`;
  MEALS.forEach(([m,nm])=>{const its=items(m),v=mt(m);h+=`<div class="card"><div class="mh"><h2>${nm}</h2><div class="mealTotal">${its.length?`${kcal(v)} kcal<br>P ${r1(v.p)} / F ${r1(v.f)} / C ${r1(v.c)}`:"未記録"}</div></div>`;
    its.forEach((it,i)=>{h+=`<div class="it"><div class="itn"><input class="nm2" value="${esc(it.name)}" onchange="edit('${m}',${i},'name',this.value)"><span class="tag ${it.src==="推定"||it.src==="要入力"?"est":""}">${esc(it.src||"指定")}</span><button class="x" title="★品目に登録" onclick="starIt('${m}',${i})">★</button><button class="x" title="削除" onclick="del('${m}',${i})">✕</button></div><div class="grid">${K.map(k=>`<div class="fld"><label style="color:${KC[k]}">${k.toUpperCase()}</label><input type="number" inputmode="decimal" step="0.1" value="${r1(it[k])}" onchange="edit('${m}',${i},'${k}',this.value)"></div>`).join("")}</div></div>`});
    h+=`<div class="inp"><input id="t_${m}" class="txt" placeholder="1品ずつ：鶏むね200g / 卵2個 / プロテイン P20 F2 C4" value="${esc(txt[m]||"")}" oninput="txt['${m}']=this.value" onkeydown="if(event.key==='Enter')addEstimate('${m}')"><button class="sm pri" onclick="addEstimate('${m}')">1品追加</button></div>`;
    h+=`<details class="aiBox"><summary>✨ まとめ入力・ChatGPTで推定</summary><textarea id="ai_${m}" placeholder="例：セブンの鮭おにぎり1個、ゆで卵1個、無糖ヨーグルト100g" oninput="aiTxt['${m}']=this.value">${esc(aiTxt[m]||"")}</textarea><div class="aiActions"><button class="sm pri" onclick="addBatchEstimate('${m}')">このアプリで簡易推定</button><button class="sm" onclick="copyAIPrompt('${m}',true)">ChatGPTに聞く</button></div><div class="aiHint">ChatGPTに聞く → 返答のJSONをコピー → この画面に戻って「クリップボードから登録」でOK。</div><div class="aiPaste"><div class="aiActions"><button class="sm pri" onclick="importClipboard('${m}')">📋 クリップボードから登録</button></div><textarea id="aip_${m}" placeholder='うまく読めない時だけ、ChatGPTのJSON結果をここに貼り付け' oninput="aiPaste['${m}']=this.value">${esc(aiPaste[m]||"")}</textarea><div class="aiActions"><button class="sm" onclick="importAIResult('${m}')">貼り付け欄から登録</button></div></div></details>`;
    h+=`<details class="manual"><summary>PFCを数字で指定して追加</summary><div class="manualGrid"><input id="mn_${m}" placeholder="品目名"><input id="mp_${m}" type="number" inputmode="decimal" placeholder="P"><input id="mf_${m}" type="number" inputmode="decimal" placeholder="F"><input id="mc_${m}" type="number" inputmode="decimal" placeholder="C"><button class="sm" onclick="addManual('${m}')">指定値で追加</button></div></details>`;
    if(msg[m])h+=`<div class="note" style="margin-top:7px">${esc(msg[m])}</div>`;
    if(S.favs.length)h+=`<div class="chips">${S.favs.map(f=>`<button class="chip" onclick="addFav('${m}',${f.id})">★ ${esc(f.name)}</button>`).join("")}</div>`;
    h+=`</div>`;
  });
  return h+`<p class="note">簡易推定は目安。商品ラベルなど正確なPFCが分かる場合は「P20 F2 C4」のように書くか、指定入力を使ってね。ChatGPT連携はAPIキーをHTMLに保存せず、コピー＆貼り付け方式にしてあるよ。</p>`;
}

function viewList(){
  let h=`<h1>食べたもの一覧</h1>${dateBar()}<div class="card" style="margin-top:10px">`;
  let count=0;
  MEALS.forEach(([m,nm])=>{const its=items(m);if(!its.length)return;count+=its.length;const v=mt(m);h+=`<div class="listGroup"><div class="listHead"><b>${nm}</b><span class="note">P${r1(v.p)} F${r1(v.f)} C${r1(v.c)} / ${kcal(v)}kcal</span></div>`;its.forEach(it=>{h+=`<div class="row"><div><b>${esc(it.name)}</b><div class="n">${esc(it.src||"指定")}</div></div><div style="text-align:right;font-size:12px"><span class="pc">P ${r1(it.p)}</span>　<span class="fc">F ${r1(it.f)}</span>　<span class="cc">C ${r1(it.c)}</span><div class="n">${kcal(it)} kcal</div></div></div>`});h+=`</div>`});
  if(!count)h+=`<div class="empty">この日はまだ記録なし</div>`;
  const t=total(date);h+=`</div><div class="card"><h2>この日の合計</h2>${bars(t)}</div>`;return h;
}

function viewFavs(){let h=`<h1>よく使う品目</h1><div class="card">`;h+=S.favs.length?S.favs.map(f=>`<div class="row"><div><b>★ ${esc(f.name)}</b><div class="n">P${r1(f.p)} F${r1(f.f)} C${r1(f.c)} ／ ${kcal(f)}kcal</div></div><button class="sm" onclick="delFav(${f.id})">削除</button></div>`).join(""):`<div class="note">今日の記録で ★ を押すとここに登録できるよ。</div>`;h+=`<div class="add"><input class="nm" id="fn" placeholder="品目名（例：いつものプロテイン）"><input id="fp" type="number" inputmode="decimal" placeholder="P"><input id="ff" type="number" inputmode="decimal" placeholder="F"><input id="fc" type="number" inputmode="decimal" placeholder="C"><button class="sm pri" onclick="addNewFav()">登録</button></div></div>`;return h}

function viewHist(){const ds=Object.keys(S.days).filter(d=>MEALS.some(([m])=>(S.days[d][m]||[]).length)).sort().reverse();let h=`<h1>過去の記録</h1><div class="card">`;h+=ds.length?ds.map(d=>{const t=total(d),cnt=MEALS.reduce((a,[m])=>a+(S.days[d][m]||[]).length,0);return `<div class="row" onclick="date='${d}';tab='list';render();scrollTo(0,0)" style="cursor:pointer"><div><b>${label(d)}</b><div class="n">${cnt}品目 ／ ${kcal(t)} kcal</div></div><div style="text-align:right;font-size:13px"><span class="pc">P ${r1(t.p)}</span>　<span class="fc">F ${r1(t.f)}</span>　<span class="cc">C ${r1(t.c)}</span></div></div>`}).join(""):`<div class="note">記録した日がここに並ぶよ。</div>`;return h+`</div>`}

function viewGoal(){let h=`<h1>1日の目標</h1><div class="card"><div class="grid">`;K.forEach(k=>h+=`<div class="fld"><label style="color:${KC[k]}">${KN[k]}</label><input type="number" inputmode="decimal" value="${S.t[k]}" onchange="setT('${k}',this.value)"></div>`);return h+`</div><div class="kcal">目標カロリー: ${kcal(S.t)} kcal</div></div><div class="card"><h2>バックアップ・復元</h2><p class="note">記録・目標・★品目をまとめてJSONファイルに保存できるよ。機種変更やブラウザデータ削除に備えて、ときどきバックアップ推奨。</p><div class="aiActions"><button class="sm pri" onclick="exportBackup()">⬇️ バックアップを書き出す</button><button class="sm" onclick="document.getElementById('restoreFile').click()">⬆️ バックアップから復元</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(this.files[0])"><p class="note" style="margin-bottom:0">復元すると、この端末にある現在の記録はバックアップ内容で置き換わるよ。</p></div><div class="card"><h2>ホーム画面で使う</h2><p class="note">SafariでこのPFCノートを開き、共有 →「ホーム画面に追加」→「ウェブアプリとして開く」をオンにすると、アプリっぽく起動できるよ。</p></div><p class="note">記録はこの端末のブラウザ内に保存されるよ。ブラウザのデータを消すと記録も消えるので注意。</p>`}

function render(){
  const ae=document.activeElement,id=ae&&ae.id,pos=ae&&ae.selectionStart;
  document.getElementById("app").innerHTML={today:viewToday,list:viewList,favs:viewFavs,hist:viewHist,goal:viewGoal}[tab]();
  if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
  document.getElementById("nav").innerHTML=[["today","記録"],["list","一覧"],["favs","★品目"],["hist","履歴"],["goal","目標"]].map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render();scrollTo(0,0)">${n}</button>`).join("");
}
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
